{% extends "base.html" %}

{% block content %}
<h1>My Services</h1>

{% for service in services %}
  <div class="user-card">
    <strong>{{ service.title }}</strong>
    <span class="badge">{{ service.status }}</span>
    <span>{{ service.category.name }}</span>
    <span>{{ service.city }}</span>
  </div>
{% else %}
  <p>You have not added any services yet.</p>
{% endfor %}

<a href="{{ url_for('services.add') }}">Add New Service</a>
{% endblock %}
